name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # sentence-transformers/transformers download model weights from the
      # Hugging Face Hub on first use; caching avoids re-downloading them on
      # every run.
      - name: Cache Hugging Face model downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 src tests scripts

      - name: Run tests
        run: pytest -q --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml

  docker-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docker-compose.yml declares `env_file: .env`; docker compose needs
      # that file to exist to validate the config, even though every value
      # here is a blank placeholder from .env.example (never real secrets).
      - name: Prepare placeholder .env for compose validation
        run: cp .env.example .env

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config

      - name: Validate infrastructure/docker-compose.kafka.yml
        run: docker compose -f infrastructure/docker-compose.kafka.yml config

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (validation only, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rag-api:ci-validate
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

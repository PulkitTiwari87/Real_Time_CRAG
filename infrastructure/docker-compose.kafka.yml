# Local single-broker Kafka (KRaft mode, no Zookeeper needed) for Phase 11
# development. Not verified in this sandbox (no Docker available here) --
# run and verify locally with:
#
#   docker compose -f infrastructure/docker-compose.kafka.yml up -d
#
# Then point LLM_PROVIDER-style config at KAFKA_BOOTSTRAP_SERVERS=localhost:9092
# (see .env.example) and run scripts/run_streaming_ingestion.py.
services:
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka

volumes:
  kafka_data:
